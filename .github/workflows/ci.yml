name: ci

on:
  push:
    branches: [mera, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: x86_64 full suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: uname -r
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - run: cargo test --no-default-features

  miri:
    name: miri aliasing model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test --lib owned::miri
      - run: cargo miri test --lib --no-default-features owned::miri

  cross_compile:
    name: compile ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --all-targets --target ${{ matrix.target }}

  unsupported_target_is_refused:
    name: i686 is rejected, not miscompiled
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Building for an unlisted arch must fail with our compile_error
        run: |
          if cargo check --lib --target i686-unknown-linux-gnu 2>err.log; then
            echo "::error::i686 built successfully; it has no verified syscall table"
            exit 1
          fi
          grep -q "no syscall table for this architecture" err.log || {
            echo "::error::i686 failed for an unexpected reason:"
            cat err.log
            exit 1
          }
          echo "i686 correctly refused by the crate's own compile_error"

  cross_execute:
    name: execute layout+ABI on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Struct layouts and SQE encoding under qemu
        run: >
          cross test --target ${{ matrix.target }} --lib --
          layout _offsets sqe_builder --skip a_region_too_small
