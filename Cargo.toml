[package]
name = "ququmatz"
version = "0.11.2"
edition = "2024"
rust-version = "1.85"
description = "Zero-dependency io_uring bindings via raw syscalls, no libc"
license = "MIT"
repository = "https://github.com/42Pupusas/ququmatz"
keywords = ["io-uring", "linux", "no-std", "async", "syscall"]
categories = ["os::linux-apis", "no-std"]

[lints.clippy]
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
criterion = "0.5"
io-uring = "0.7"

[[bench]]
name = "io_uring"
harness = false

[[bench]]
name = "comparison"
harness = false

