[package]
name = "ququmatz"
version = "0.15.1"
edition = "2024"
description = "Zero-dependency io_uring bindings via raw syscalls, no libc"
license = "MIT"
repository = "https://github.com/42Pupusas/ququmatz"
keywords = ["io-uring", "linux", "no-std", "async", "syscall"]
categories = ["os::linux-apis", "no-std"]

[lints.clippy]
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
dhat = { version = "0.3", optional = true }

[dev-dependencies]
divan = "0.1"
trybuild = "1"

# io-uring ships a prebuilt sys.rs valid only for x86_64 and refuses to
# compile elsewhere. It backs benches/comparison only.
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
io-uring = "0.7"

[[bench]]
name = "io_uring"
harness = false

[[bench]]
name = "comparison"
harness = false

